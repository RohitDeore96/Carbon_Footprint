name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Force Node 24 to clear deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  Backend-Quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 pytest pytest-cov
          
      - name: Run Black formatter check
        run: black . --check
        
      - name: Run Flake8 linter
        # Ignore line length and whitespace rules since Black handles our formatting
        run: flake8 . --extend-ignore=E501,W391,W293
        
      - name: Run Pytests with coverage
        run: pytest --cov=app --cov-fail-under=90

  Frontend-Quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        # Bypass strict peer dependency version locking
        run: npm install --legacy-peer-deps
        
      - name: Run ESLint
        run: npm run lint

      - name: Frontend Tests
        run: npm test

      - name: Run build
        run: npm run build

  Deploy:
    needs: [Backend-Quality, Frontend-Quality]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_KEY }}" ]; then
            echo "::warning::Deployment secret GOOGLE_CLOUD_SERVICE_ACCOUNT_KEY is not configured. Skipping deploy."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node 20
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Authenticate to Google Cloud
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_KEY }}

      - name: Setup gcloud CLI
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: gcloud run deploy carbon-footprint-api --source ./backend --region us-central1 --allow-unauthenticated

      - name: Install frontend dependencies
        if: steps.check-secrets.outputs.has_secrets == 'true'
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Install Firebase CLI
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: npm install -g firebase-tools

      - name: Write Firebase credentials
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          GCP_KEY: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_KEY }}
        run: echo "$GCP_KEY" > /home/runner/gcp-key.json

      - name: Build and deploy frontend to Firebase
        if: steps.check-secrets.outputs.has_secrets == 'true'
        working-directory: frontend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/gcp-key.json
        run: npm run build && firebase deploy --only hosting